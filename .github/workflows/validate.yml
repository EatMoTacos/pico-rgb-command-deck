name: Validate firmware

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m py_compile code.py tesmart_commands.py boot.py tests/test_mapping.py
      - name: Validate command mapping
        run: python tests/test_mapping.py
